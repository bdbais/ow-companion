# Regenerates the dataset from the wiki once a week and opens a pull request when the
# numbers have moved.
#
# It deliberately does not push to main. The parsers have been silently wrong before - a
# per-bullet reload read as a full one, an ability box read from the wrong section - so the
# point of this job is to put the change in front of a human with a readable summary, not
# to save the click.
name: Refresh dataset

on:
  schedule:
    # Mondays, 05:00 UTC. Overwatch patches usually land mid-week, so by Monday the wiki
    # editors have normally caught up.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-dataset
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pipeline is stdlib-only, so there is nothing to install.

      - name: Keep the dataset as it stands
        run: cp dataset/dataset-v1.json "${RUNNER_TEMP}/before.json"

      - name: Regenerate from the wiki
        run: |
          set -euo pipefail
          python tools/fetch_wiki.py
          python tools/fetch_media.py
          python tools/parse_weapons.py
          python tools/parse_abilities.py
          python tools/parse_patchlog.py
          python tools/parse_matchups.py
          python tools/parse_stadium.py
          python tools/build_dataset.py

      - name: Describe what changed
        id: describe
        run: |
          set -euo pipefail
          python tools/diff_dataset.py \
            "${RUNNER_TEMP}/before.json" dataset/dataset-v1.json --markdown \
            > "${RUNNER_TEMP}/summary.md"
          cat "${RUNNER_TEMP}/summary.md"
          if git diff --quiet && git diff --quiet --cached; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Say so when nothing moved
        if: steps.describe.outputs.changed == 'false'
        run: echo "The wiki has not moved since the last run. No pull request opened."

      - name: Open a pull request
        if: steps.describe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="dataset/refresh-$(date -u +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Refresh the dataset from the wiki"
          git push --force-with-lease -u origin "$branch"

          {
            echo "Regenerated by \`.github/workflows/refresh-dataset.yml\`."
            echo
            cat "${RUNNER_TEMP}/summary.md"
            echo
            echo "Hand corrections in \`dataset/overrides.json\` are applied after parsing,"
            echo "so they survive this. Check \`dataset/review.md\` in the diff for anything"
            echo "the parsers could not read."
          } > "${RUNNER_TEMP}/body.md"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "${RUNNER_TEMP}/body.md"
            echo "Updated pull request #${existing}."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Dataset refresh, $(date -u +%Y-%m-%d)" \
              --body-file "${RUNNER_TEMP}/body.md"
          fi
