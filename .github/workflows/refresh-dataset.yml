# Regenerates the dataset from the wiki every morning at six, Italian time, and publishes it
# to installed apps on its own when nothing looks broken.
#
# Until November 2026 this ran weekly and only ever opened a pull request, on the grounds
# that the parsers have been silently wrong before - a per-bullet reload read as a full one,
# an ability box read from the wrong section. The reasoning was sound and the result was
# not: nine pull requests piled up unmerged over two months, and no phone got a single new
# number until the dataset was regenerated by hand.
#
# So the reviewer is now two checks that run before anything is published. The unit tests,
# which pin hand-copied values against the data (a Take a Breather that stops being 200 per
# second fails one), and tools/check_refresh.py, which refuses the shapes a broken parser
# produces: a hero gone, a weapon table emptied, a patch log that stopped being read. When
# either objects, the change goes to a pull request exactly as before, with the reason in it.
name: Refresh dataset

on:
  schedule:
    # GitHub only speaks UTC, and Italy moves between UTC+1 and UTC+2. Both candidate hours
    # are scheduled and the clock job below lets through only the one that is six o'clock in
    # Rome today. Seven minutes past rather than on the hour, because the top of the hour is
    # when every scheduled workflow on GitHub starts and runs get queued late.
    - cron: "7 4 * * *"
    - cron: "7 5 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Run the checks and the tests even if nothing changed; publish nothing"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # To start "Publish dataset" after pushing: a push made with this workflow's token does
  # not trigger other workflows, but an explicit dispatch does.
  actions: write

concurrency:
  group: refresh-dataset
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.rome.outputs.run }}
    steps:
      - name: Is it six in Rome?
        id: rome
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # +0200 in summer time, +0100 in winter. Read from today's date rather than from the
          # time the runner starts, so a run GitHub queues late still counts as the right one.
          offset="$(TZ=Europe/Rome date +%z)"
          case "${{ github.event.schedule }}|${offset}" in
            "7 4 * * *|+0200"|"7 5 * * *|+0100") echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "Not six in Rome on this schedule." ;;
          esac

  refresh:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pipeline is stdlib-only, so there is nothing to install.

      - name: Keep the dataset as it stands
        run: cp dataset/dataset-v1.json "${RUNNER_TEMP}/before.json"

      - name: Regenerate from the wiki
        run: |
          set -euo pipefail
          python tools/fetch_wiki.py
          python tools/fetch_media.py
          python tools/parse_weapons.py
          python tools/parse_abilities.py
          python tools/parse_patchlog.py
          python tools/parse_matchups.py
          python tools/parse_stadium.py
          python tools/build_dataset.py

      - name: Describe what changed
        id: describe
        run: |
          set -euo pipefail

          # dataset/roster.json records each wiki page's byte size, which moves whenever an
          # editor fixes a typo. Judging by it would publish every day saying nothing. A
          # genuinely new hero still shows up, through the dataset itself.
          if git status --porcelain -- . ':(exclude)dataset/roster.json' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "verify=${{ inputs.check_only == true }}" >> "$GITHUB_OUTPUT"
          fi

          {
            python tools/diff_dataset.py \
              "${RUNNER_TEMP}/before.json" dataset/dataset-v1.json --markdown
            echo
            echo "Files touched:"
            echo
            echo '```'
            git status --porcelain -- . ':(exclude)dataset/roster.json'
            echo '```'
          } > "${RUNNER_TEMP}/summary.md"
          cat "${RUNNER_TEMP}/summary.md"

      - name: Say so when nothing moved
        if: steps.describe.outputs.changed == 'false'
        run: echo "The wiki has not moved since the last run. Nothing to publish."

      - name: Look for a broken parser
        id: shape
        if: steps.describe.outputs.verify == 'true'
        run: |
          set -uo pipefail
          if python tools/check_refresh.py "${RUNNER_TEMP}/before.json" dataset/dataset-v1.json \
              > "${RUNNER_TEMP}/shape.txt"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat "${RUNNER_TEMP}/shape.txt"

      - uses: actions/setup-java@v4
        if: steps.describe.outputs.verify == 'true' && steps.shape.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Run the unit tests against the new data
        id: tests
        if: steps.describe.outputs.verify == 'true' && steps.shape.outputs.ok == 'true'
        run: |
          set -uo pipefail
          chmod +x gradlew
          if ./gradlew testDebugUnitTest --console=plain -q > "${RUNNER_TEMP}/tests.txt" 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          tail -40 "${RUNNER_TEMP}/tests.txt"

      - name: Fail a check-only run whose checks failed
        if: steps.describe.outputs.changed == 'false' && steps.describe.outputs.verify == 'true' && (steps.shape.outputs.ok != 'true' || steps.tests.outputs.ok != 'true')
        run: |
          echo "A check failed on the current dataset; see the steps above."
          exit 1

      - name: Publish straight to master
        if: steps.describe.outputs.changed == 'true' && steps.shape.outputs.ok == 'true' && steps.tests.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh the dataset from the wiki, $(date -u +%Y-%m-%d)"
          # Anything pushed to master since checkout goes underneath, not on top.
          git pull --rebase -q origin master
          git push -q origin HEAD:master
          gh workflow run publish-dataset.yml --ref master
          {
            echo "### Published, $(date -u +%Y-%m-%d)"
            echo
            cat "${RUNNER_TEMP}/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed to master and started Publish dataset."

      - name: Open a pull request instead
        if: steps.describe.outputs.changed == 'true' && (steps.shape.outputs.ok != 'true' || steps.tests.outputs.ok != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="dataset/refresh-$(date -u +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Refresh the dataset from the wiki"
          git push --force-with-lease -u origin "$branch"

          {
            echo "Regenerated by \`.github/workflows/refresh-dataset.yml\`, and **not**"
            echo "published on its own, because a check objected:"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/shape.txt" 2>/dev/null || true
            tail -40 "${RUNNER_TEMP}/tests.txt" 2>/dev/null || true
            echo '```'
            echo
            cat "${RUNNER_TEMP}/summary.md"
            echo
            echo "Hand corrections in \`dataset/overrides.json\` are applied after parsing,"
            echo "so they survive this. Check \`dataset/review.md\` in the diff for anything"
            echo "the parsers could not read."
          } > "${RUNNER_TEMP}/body.md"

          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "${RUNNER_TEMP}/body.md"
            echo "Updated pull request #${existing}."
          elif gh pr create \
              --base master \
              --head "$branch" \
              --title "Dataset refresh, $(date -u +%Y-%m-%d) - needs a look" \
              --body-file "${RUNNER_TEMP}/body.md"; then
            echo "Opened a pull request."
          else
            # Opening the pull request needs Settings -> Actions -> General -> "Allow GitHub
            # Actions to create and approve pull requests". Without it the branch is still
            # pushed and reviewable, so the run reports rather than fails.
            {
              echo "### Dataset refresh, $(date -u +%Y-%m-%d)"
              echo
              echo "The branch \`${branch}\` was pushed, but this repository does not let"
              echo "Actions open pull requests. Open it by hand:"
              echo
              echo "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${branch}?expand=1>"
              echo
              cat "${RUNNER_TEMP}/body.md"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Branch pushed; pull request not permitted. See the run summary."
          fi
          # Red, so the run shows up as needing attention rather than as a quiet success.
          exit 1
